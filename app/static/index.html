<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Telemetry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0B0F19; color: #E2E8F0; }
    .tech-font { font-family: 'JetBrains Mono', monospace; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen p-6 antialiased">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex items-center justify-between pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-white">Model Telemetry</h1>
        <p class="text-sm text-slate-400 mt-1">Real-time inference monitoring & diagnostics</p>
      </div>
      <div class="flex items-center space-x-2">
        <span class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <span class="text-sm font-medium text-emerald-400">System Healthy</span>
      </div>
    </header>

    <!-- Metrics Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="glass-panel rounded-xl p-6 shadow-lg">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Total Requests</h3>
        <div class="text-4xl text-white tech-font" id="stat-requests">0</div>
      </div>
      
      <div class="glass-panel rounded-xl p-6 shadow-lg">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Avg Latency</h3>
        <div class="text-4xl text-cyan-400 tech-font" id="stat-latency">0.0<span class="text-lg text-slate-500 ml-1">ms</span></div>
      </div>

      <div class="glass-panel rounded-xl p-6 shadow-lg flex flex-col justify-center">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Manual Override</h3>
        <button id="predict-btn" onclick="sendPrediction()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-medium py-2.5 px-4 rounded transition-colors duration-200">
          Inject Test Payload
        </button>
        <div id="predict-result" class="mt-2 text-xs text-slate-400 tech-font h-4"></div>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="glass-panel rounded-xl p-6 shadow-lg">
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Live Prediction Stream</h3>
      <div class="w-full h-64">
        <canvas id="predictionChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    // Chart.js dark mode configuration
    Chart.defaults.color = '#64748b';
    Chart.defaults.font.family = "'JetBrains Mono', monospace";
    
    const ctx = document.getElementById('predictionChart').getContext('2d');
    
    // Create gradient for the line chart
    let gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, 'rgba(6, 182, 212, 0.5)'); // Cyan
    gradient.addColorStop(1, 'rgba(6, 182, 212, 0.0)');

    const predictionChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Class Output',
          data: [],
          borderColor: '#06b6d4',
          backgroundColor: gradient,
          borderWidth: 2,
          pointBackgroundColor: '#0f172a',
          pointBorderColor: '#06b6d4',
          pointBorderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6,
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: { 
          y: { 
            min: 0, 
            max: 2, 
            ticks: { stepSize: 1, color: '#94a3b8' },
            grid: { color: 'rgba(255, 255, 255, 0.05)' }
          },
          x: {
            grid: { display: false },
            ticks: { color: '#94a3b8' }
          }
        }
      }
    });

    async function fetchMetrics() {
      try {
        const res = await fetch('/api/metrics');
        const data = await res.json();
        
        document.getElementById('stat-requests').innerText = data.total_requests;
        document.getElementById('stat-latency').innerHTML = `${data.average_latency_ms}<span class="text-lg text-slate-500 ml-1">ms</span>`;
        
        predictionChart.data.labels = data.recent_predictions.map((_, i) => `REQ-${String(i + 1).padStart(2, '0')}`);
        predictionChart.data.datasets[0].data = data.recent_predictions;
        predictionChart.update();
      } catch (err) {
        console.error('Telemetry error:', err);
      }
    }

    async function sendPrediction() {
      const sampleFeatures = {
        sepal_length: (Math.random() * 3 + 4).toFixed(1),
        sepal_width: (Math.random() * 2 + 2).toFixed(1),
        petal_length: (Math.random() * 4 + 1).toFixed(1),
        petal_width: (Math.random() * 2 + 0.1).toFixed(1)
      };

      const res = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sampleFeatures)
      });
      const data = await res.json();
      document.getElementById('predict-result').innerText = `Class: ${data.prediction} | Lat: ${data.latency_ms}ms`;
      fetchMetrics();
    }

    setInterval(fetchMetrics, 2000);
    fetchMetrics();
  </script>
</body>
</html>
